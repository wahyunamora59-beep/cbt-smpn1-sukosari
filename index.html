<!-- LOGIN SCREEN -->
<div id="loginScreen">
    <div class="login-header">
        <!-- LOGO - GANTI FILE_ID DENGAN ID ANDA -->
        <div class="logo-placeholder">
            <img src="https://drive.google.com/uc?export=view&id=FILE_ID_ANDA" alt="Logo SMPN 1 Sukosari">
        </div>
        <div class="school-name">SMP NEGERI 1 SUKOSARI</div>
        <div class="exam-subtitle">Computer Based Test</div>
    </div>
    
    <div class="input-group">
        <label><i class="fas fa-user"></i> Username</label>
        <input type="text" id="usernameInput" placeholder="Contoh: budi.santoso" autocomplete="off">
    </div>
    
    <div class="input-group">
        <label><i class="fas fa-key"></i> Token Ujian</label>
        <div class="password-wrapper">
            <input type="password" id="tokenInput" placeholder="Masukkan Token" autocomplete="off">
            <i class="fas fa-eye toggle-password" onclick="togglePassword()"></i>
        </div>
    </div>
    
    <button class="btn-login" onclick="handleLogin()">MULAI UJIAN</button>
    
    <p class="warning-text">
        <i class="fas fa-shield-alt"></i> 
        Jangan keluar aplikasi selama ujian berlangsung
    </p>
</div>
